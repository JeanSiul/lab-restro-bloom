name: Fix POS lab scrolling v2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_scroll_v2_20260828.py'
      - '.github/workflows/fix-scroll-v2-20260828.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply robust scroll fix
        run: python3 .github/scripts/fix_scroll_v2_20260828.py
      - name: Verify CSS
        run: |
          grep -q 'min-height:0;overflow:hidden' public/index.html
          grep -q 'overflow-y:auto' public/index.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix: make POS content area scroll reliably'
            git push origin main
          fi
